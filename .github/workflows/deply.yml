name: Deply Git Action
#언제부터 배포를 시작할건지 - main에서 push를 했을 경우배포
on: 
  push: 
    branches: 
      - main
#작업 지시
jobs:
  deploy:
    runs-on: self-hosted #현재 Ubuntu에 배포
    #어떤 순서로 진행할지
    steps:
      # 소스코드 다운로드 = git clone과 동일
      - uses: actions/checkout@v4
      # JDK 21버전인지 확인
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # gradlew 권한부여
      - run: chmod +x gradlew
      # 빌드
      - run: ./gradlew clean build -x test
      # 실행 => jar파일 생성 => java -jar app.jar
      - run: |
          PID=$(lsof -t -i:8080)
          [-n "$PID" ] && kill -15 $PID || true
      - run: nohub java -jar build/libs/*.0.0.1-SNAPSHOT.jar > app.log 2>&1 &
      
