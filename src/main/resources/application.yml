#port 지정 => default 8080
#spring seetting => DB (datasource) , JPA , ThymeLeaf , Mybatis , Logginh , security , springAI , websocket = 카프카
server:
  servlet:
    context-path: /
spring: 
  #파일 업로드
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
           
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: hr
    password: happy
    driver-class-name: oracle.jdbc.driver.OracleDriver




# JAP -> Hibernate -> SQL문장 생성 -> Oracle DB 실행
# SELECT NVL(Max(no)+1,1) FROM board   => Oracle
# SELECT IFNULL(Max(no)+1,1) FROM board  => Mysql
  jpa:
    database: oracle
    properties:
      hibernate: 
        # 각 데이터베이스에 맞는 SQL문법 생성
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        user_sql_comments: true
   
  thymeleaf: 
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML

file:
  upload_dir: C:/upload

mybatis: 
  type-aliases-package: com.sist.web.vo
  mapper-locations: mybatis/mapper/*.xml
  
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

